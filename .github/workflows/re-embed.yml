name: Re-embed Jobs

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Embedding batch size (default: 32)'
        required: false
        default: '32'
      since_days:
        description: 'Only active jobs embedded in the last N days (blank = all active jobs)'
        required: false
        default: ''
      missing_llm_only:
        description: 'With since_days: only jobs whose LLM fields (skills/seniority) are empty'
        required: false
        type: boolean
        default: false
      llm_workers:
        description: 'Parallel LLM cleaning calls (default: 8)'
        required: false
        default: '8'
      skip_llm:
        description: 'Skip the LLM cleaning pass entirely'
        required: false
        type: boolean
        default: false

jobs:
  re-embed:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-models-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Re-embed jobs
        run: |
          ARGS=(--db-url "$DATABASE_URL" --batch-size "$BATCH_SIZE" --llm-workers "$LLM_WORKERS")
          if [ -n "$SINCE_DAYS" ]; then ARGS+=(--since-days "$SINCE_DAYS"); fi
          if [ "$MISSING_LLM_ONLY" = "true" ]; then ARGS+=(--missing-llm-only); fi
          if [ "$SKIP_LLM" = "true" ]; then ARGS+=(--skip-llm); fi
          echo "mcf re-embed ${ARGS[*]/$DATABASE_URL/<db>}"
          uv run mcf re-embed "${ARGS[@]}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '32' }}
          SINCE_DAYS: ${{ github.event.inputs.since_days }}
          MISSING_LLM_ONLY: ${{ github.event.inputs.missing_llm_only }}
          LLM_WORKERS: ${{ github.event.inputs.llm_workers || '8' }}
          SKIP_LLM: ${{ github.event.inputs.skip_llm }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JOB_EXTRACTOR_LLM_ENABLED: "1"
          # Re-embedded text always changes, so the content-hash cache only adds
          # two DB round trips per job on a runner far from the DB.
          ENABLE_EMBEDDINGS_CACHE: "0"

      - name: Rebuild HNSW indexes
        run: |
          psql "$DATABASE_URL" <<'SQL'
            -- SGSAL-025: the production index is the halfvec expression index
            -- (migration 023). This is only a safety net for a missing index;
            -- a real rebuild is done by hand with CREATE INDEX CONCURRENTLY.
            -- Never recreate idx_job_embeddings_vector here: it is 1.9 GB and
            -- the store's ORDER BY no longer matches it.
            CREATE INDEX IF NOT EXISTS idx_job_embeddings_halfvec
              ON job_embeddings
              USING hnsw ((embedding::halfvec(768)) halfvec_cosine_ops)
              WITH (m = 16, ef_construction = 64);

            CREATE INDEX IF NOT EXISTS idx_candidate_embeddings_vector
              ON candidate_embeddings
              USING hnsw (embedding vector_cosine_ops);
          SQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Print summary
        if: always()
        run: echo "Re-embed finished at $(date -u)"
